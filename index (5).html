<!DOCTYPE html>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            /* BACKGROUND PICTURE KEPT EXACTLY THE SAME */
            background: url('28.jpg') no-repeat center center fixed;
            background-size: cover;
            overflow-x: hidden; /* Prevents unwanted horizontal scrolling */
        }
        
        nav {
            background: orange;
            padding: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            box-sizing: border-box;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        
        nav a:hover {
            text-decoration: underline;
        }
        
        /* Stretches the product overlay area to the absolute full width and full height */
        .products {
            padding: 40px 10%; /* Matches the 10% edge spacing from the home page */
            text-align: center;
            box-sizing: border-box;
            width: 100%;
            min-height: calc(100vh - 56px); /* Forces it to fill the entire vertical screen below nav */
            
            /* Modern glass overlay style matching your home page theme */
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .products h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
            margin-bottom: 20px;
        }
        
        .products h1:nth-of-type(2) {
            font-size: clamp(16px, 2.5vh, 22px);
            font-weight: normal;
            max-width: 900px;
            margin: 0 auto 40px auto;
            line-height: 1.5;
        }
        
        .container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            max-width: 1400px; /* Limits container width on huge monitors */
            margin: 0 auto;
        }
        
        .card {
            background: white;
            width: 220px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        
        .card:hover {
            transform: translateY(-5px); /* Simple premium bounce effect on hover */
        }
        
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
        }
        
        .card h2 {
            color: #333;
            margin: 15px 0;
            font-size: 24px;
        }
        
        .card h2::before {
            content: "₱"; /* Adds a currency symbol placeholder before the price values */
            font-size: 18px;
            margin-right: 2px;
        }
        
        button {
            background: #111;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }
        
        button:hover {
            background: orange; /* Color change feedback when buying */
        }

        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 10px;
            }
            .products {
                padding: 30px 20px;
            }
        }
    </style>
</head>
