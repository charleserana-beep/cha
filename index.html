<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            /* BACKGROUND PICTURE KEPT EXACTLY THE SAME */
            background: url("11.jpg") no-repeat center center fixed;
            background-size: cover;
            overflow: hidden; /* Disables unwanted scrollbars */
        }
        
        /* Glass wrapper panel stretched to cover the entire screen */
        .login-box {
            width: 100%;
            height: 100vh;
            padding: 40px;
            
            /* Full-screen glass overlay style matching your site theme */
            background: rgba(0, 0, 0, 0.55); /* Tinted slightly darker to keep input fields crisp */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            /* Removed structural outer borders/radius to achieve edge-to-edge finish */
            border: none;
            border-radius: 0;
            
            /* Center align the internal login elements layout block */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            box-shadow: none;
        }
        
        /* Form wrapper to lock input element sizing inside the full-screen layout */
        form {
            width: 100%;
            max-width: 360px; /* Keeps the login inputs comfortably sized in the screen center */
        }
        
        .login-logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin-bottom: 20px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }
        
        h1 {
            margin-bottom: 30px;
            margin-top: 0;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            outline: none;
            font-size: 15px;
            transition: border-color 0.2s, background 0.2s;
        }
        
        input:focus {
            border-color: orange;
            background: rgba(255, 255, 255, 0.25);
        }
        
        input::placeholder {
            color: rgba(255, 255, 255, 0.8);
        }
        
        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: white;
            color: black;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s, color 0.2s;
        }
        
        button:hover {
            background: orange;
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <!-- Logo structure optimized with clean layout sizing -->
        <img src="111.jpg" alt="Logo" class="login-logo" onerror="this.src='https://ftcdn.net'">
        
        <h1>🔒Char Shop🔑</h1>
        <form onsubmit="login(event)">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
    
    <script>
        function login(event) {
            event.preventDefault();
            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;
            if (username === "chat" && password === "123") {
                window.location.href = "home.html";
            } else {
                alert("Incorrect username or password!");
            }
        }
    </script>
</body>
</html>
