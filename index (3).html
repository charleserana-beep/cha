<!DOCTYPE html>
<html>
<head>
    <title>Contact</title>
    <style>
        body { 
            margin: 0; 
            font-family: Arial; 
            /* Added matching background image properties below */
            background: url('19.jpg') no-repeat center center fixed; 
            background-size: cover;
        }
        nav { background: orange; padding: 18px; text-align: center; }
        nav a {
            color: white; text-decoration: none;
            margin: 15px; font-weight: bold;
        }
        .contact { 
            padding: 60px 20px; 
            text-align: center; 
            /* Added semi-transparent white section for text and form readability */
            background-color: rgba(255, 255, 255, 0.7);
            min-height: 100vh;
            box-sizing: border-box;
        }
        form { 
            max-width: 500px; 
            margin: auto; 
            /* Added light background to form container to pop out from the page overlay */
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        input, textarea {
            width: 100%; padding: 12px; margin: 8px 0;
            border: 1px solid #ccc; border-radius: 7px;
            box-sizing: border-box; /* Ensures padding does not break width */
        }
        textarea { height: 120px; }
        button {
            padding: 12px 30px; background: #111;
            color: white; border: none; border-radius: 7px;
            cursor: pointer;
            width: 100%; /* Spans across the bottom of the form nicely */
            font-weight: bold;
        }
        button:hover {
            background: #333; /* Smooth hover transition effect */
        }
    </style>
</head>
<body>
<nav>
    <a href="Home.html">🏭Home</a> 
        <a href="About.html">❓About</a> 
        <a href="Products.html">📦Products</a> 
        <a href="Contact.html">💬Contact</a> 
        <a href="Films.html">&#x1F3A5;Films</a> 
<!-- Redirects the user back to the login page -->
        <a href="Login.html">&#x1F6AA;Logout</a> 
</nav>
<div class="contact">
    <h1>📞Contact Us</h1>
    <form>
        <input type="text" placeholder="Charles Lambayan" required>
        <input type="email" placeholder="charleserana@gmai.com" required>
        <textarea placeholder="Have a question about our products, need help with film streaming, or just want to say hello? We are always here to help and love hearing from our community. Simply fill out the form below or drop us a line, and our dedicated team will get back to you with a personalized response as soon as possible."></textarea>
        <button type="submit">Send Message</button>
    </form>
</div>
</body>
</html>
